# Ein Ursprung für den Browser: die Oberfläche unter /, die vier Dienste nach
# Pfadpräfix. Dieselbe Verteilung leistet im Entwicklungsbetrieb der Proxy des
# Angular-Entwicklungsservers (stromentlastung-ui/proxy.conf.json).
#
# Die Ziele stehen in Variablen, damit nginx sie bei jeder Anfrage über die
# Docker-Namensauflösung nachschlägt. Ohne das merkt sich nginx die Adresse beim
# Start und liefert 502, sobald ein Dienst neu gestartet wurde.
server {
    listen 80;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/unternehmen/ { set $ziel unternehmen:8091; proxy_pass http://$ziel; include /etc/nginx/proxy_params_stromentlastung; }
    location /api/antraege/    { set $ziel antrag:8092;      proxy_pass http://$ziel; include /etc/nginx/proxy_params_stromentlastung; }
    location /api/bescheide/   { set $ziel bescheid:8093;    proxy_pass http://$ziel; include /etc/nginx/proxy_params_stromentlastung; }
    location /api/zahlungen/   { set $ziel zahlung:8094;     proxy_pass http://$ziel; include /etc/nginx/proxy_params_stromentlastung; }

    location / { set $ziel ui:80; proxy_pass http://$ziel; include /etc/nginx/proxy_params_stromentlastung; }
}
