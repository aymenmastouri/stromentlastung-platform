# Ein Ursprung für den Browser: die Oberfläche unter /, die vier Dienste nach
# Pfadpräfix. Dieselbe Verteilung leistet im Entwicklungsbetrieb der Proxy des
# Angular-Entwicklungsservers (stromentlastung-ui/proxy.conf.json).
server {
    listen 80;
    client_max_body_size 10m;

    location /api/unternehmen/ { proxy_pass http://unternehmen:8091/api/unternehmen/; include /etc/nginx/proxy_params_stromentlastung; }
    location /api/antraege/    { proxy_pass http://antrag:8092/api/antraege/;         include /etc/nginx/proxy_params_stromentlastung; }
    location /api/bescheide/   { proxy_pass http://bescheid:8093/api/bescheide/;      include /etc/nginx/proxy_params_stromentlastung; }
    location /api/zahlungen/   { proxy_pass http://zahlung:8094/api/zahlungen/;       include /etc/nginx/proxy_params_stromentlastung; }

    location / { proxy_pass http://ui:80/; include /etc/nginx/proxy_params_stromentlastung; }
}
