# Second entrance for the demonstration: everything as in the main entrance, only
# the treasury service comes from the delivered branch. Same data, different rule.
#
# Targets are held in variables so that nginx resolves them per request through
# Docker DNS; otherwise a restarted service leaves nginx pointing at a dead address.
server {
    listen 80;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/unternehmen/ { set $ziel unternehmen:8091;    proxy_pass http://$ziel; include /etc/nginx/proxy_params_stromentlastung; }
    location /api/antraege/    { set $ziel antrag:8092;         proxy_pass http://$ziel; include /etc/nginx/proxy_params_stromentlastung; }
    location /api/bescheide/   { set $ziel bescheid:8093;       proxy_pass http://$ziel; include /etc/nginx/proxy_params_stromentlastung; }
    location /api/zahlungen/   { set $ziel zahlung-fixed:8094; proxy_pass http://$ziel; include /etc/nginx/proxy_params_stromentlastung; }

    location / { set $ziel ui:80; proxy_pass http://$ziel; include /etc/nginx/proxy_params_stromentlastung; }
}
