# Referenzverfahren stromentlastung.
#
# Standard (kein Profil): nur Keycloak — die Dienste und die Oberfläche laufen
# auf dem Rechner (scripts/stromentlastung.sh start).
# Profil "full": alles im Container hinter nginx auf Port 8090.
services:
  keycloak:
    container_name: stromentlastung-keycloak
    image: quay.io/keycloak/keycloak:24.0.2
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "9091"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "${STROMENTLASTUNG_KC_PORT:-9091}:8080"
    networks: [stromentlastung]
    restart: unless-stopped

  unternehmen:
    profiles: [full]
    build:
      context: ../stromentlastung-unternehmen
      args:
        BUILD_REVISION: ${UNTERNEHMEN_REVISION:-unbekannt}
        BUILD_REF: ${UNTERNEHMEN_REF:-unbekannt}
    environment: &dienst-env
      STROMENTLASTUNG_ISSUER: http://localhost:9091/realms/stromentlastung
      STROMENTLASTUNG_JWKS_URI: http://keycloak:8080/realms/stromentlastung/protocol/openid-connect/certs
      STROMENTLASTUNG_UNTERNEHMEN_URL: http://unternehmen:8091/api/unternehmen
      STROMENTLASTUNG_BESCHEID_URL: http://bescheid:8093/api/bescheide
      STROMENTLASTUNG_ZAHLUNG_URL: http://zahlung:8094/api/zahlungen
      STROMENTLASTUNG_H2_CONSOLE_REMOTE: "true"
    # Offen für den Blick in die Datenbank über die H2-Konsole des Dienstes.
    ports: ["127.0.0.1:8091:8091"]
    volumes: ["unternehmen-data:/app/data"]
    networks: [stromentlastung]
    depends_on: [keycloak]

  antrag:
    profiles: [full]
    build:
      context: ../stromentlastung-antrag
      args:
        BUILD_REVISION: ${ANTRAG_REVISION:-unbekannt}
        BUILD_REF: ${ANTRAG_REF:-unbekannt}
    environment: *dienst-env
    # Offen für den Blick in die Datenbank über die H2-Konsole des Dienstes.
    ports: ["127.0.0.1:8092:8092"]
    volumes: ["antrag-data:/app/data"]
    networks: [stromentlastung]
    depends_on: [keycloak, unternehmen, bescheid, zahlung]

  bescheid:
    profiles: [full]
    build:
      context: ../stromentlastung-bescheid
      args:
        BUILD_REVISION: ${BESCHEID_REVISION:-unbekannt}
        BUILD_REF: ${BESCHEID_REF:-unbekannt}
    environment: *dienst-env
    # Offen für den Blick in die Datenbank über die H2-Konsole des Dienstes.
    ports: ["127.0.0.1:8093:8093"]
    volumes: ["bescheid-data:/app/data"]
    networks: [stromentlastung]
    depends_on: [keycloak]

  zahlung:
    profiles: [full]
    build:
      context: ../stromentlastung-zahlung
      args:
        BUILD_REVISION: ${ZAHLUNG_REVISION:-unbekannt}
        BUILD_REF: ${ZAHLUNG_REF:-unbekannt}
    environment: *dienst-env
    # Offen für den Blick in die Datenbank über die H2-Konsole des Dienstes.
    ports: ["127.0.0.1:8094:8094"]
    volumes: ["zahlung-data:/app/data"]
    networks: [stromentlastung]
    depends_on: [keycloak]

  ui:
    profiles: [full]
    build: ../stromentlastung-ui
    networks: [stromentlastung]

  gateway:
    profiles: [full]
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/proxy_params_stromentlastung:/etc/nginx/proxy_params_stromentlastung:ro
    ports:
      - "${STROMENTLASTUNG_GATEWAY_PORT:-8090}:80"
    networks: [stromentlastung]
    depends_on: [ui, unternehmen, antrag, bescheid, zahlung]

networks:
  stromentlastung:
    driver: bridge

volumes:
  unternehmen-data:
  antrag-data:
  bescheid-data:
  zahlung-data:
